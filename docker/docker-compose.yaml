services:
  postgres:
    image: leogloriainfnet/postgres-tp2-spring:2.0-mac
    container_name: compose-postgres-tp3-spring
    platform: linux/arm64
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      bash -c "
      (
        until pg_isready -U postgres; do
          sleep 1;
        done;
        psql -U postgres -c \"ALTER USER postgres WITH PASSWORD 'apppass';\";
      ) &
      exec docker-entrypoint.sh postgres
      "
  
  elastic:
    depends_on:
      postgres:
        condition: service_healthy
    image: leogloriainfnet/elastic-tp2-spring:1.0-windows
    #    image: leogloriainfnet/elastic-tp2-spring:1.0-mac
    container_name: compose-guilda-es
    ports:
      - "9200:9200"
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  test:
    depends_on:
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: apppass
      SPRING_ELASTICSEARCH_URIS: http://elastic:9200
    command: [ "mvn", "test", "--quiet" ]

  app:
    depends_on:
      test:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: guildaaventureiro
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: apppass
      SPRING_ELASTICSEARCH_URIS: http://elastic:9200
